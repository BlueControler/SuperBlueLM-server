[project]
name = "IWebsocket"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alibabacloud-nls-python-sdk>=1.0.0",
    "deepagents>=0.5.2",
    "httpx>=0.28.1",
    "langchain-core>=0.3",
    "langchain-openai>=1.1.14",
    "loguru>=0.7.3",
    "mcp>=1.22",
    "pydantic>=2.11,<3",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.2",
    "tzdata>=2024.1",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "ruff>=0.8.2",
]
